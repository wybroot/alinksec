spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/alinksec?stringtype=unspecified
    username: ${PG_USER:alinksec_app}
    password: ${PG_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000

alinksec:
  database:
    type: postgres
