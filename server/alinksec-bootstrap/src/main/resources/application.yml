spring:
  application:
    name: alinksec-server
  profiles:
    default: postgres
  config:
    import: optional:file:${ALINKSEC_LIBRARY_CONFIG:./data/libraries.yml}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 512MB
      file-size-threshold: 0B

server:
  port: 8080   # M2 REST API 占位

alinksec:
  libraries:
    work-dir: ${ALINKSEC_LIBRARY_WORK_DIR:./data/libraries}
    max-download-bytes: 67108864
    max-hashes: 250000
    max-cves-per-import: 10000
    retain-versions: 10
    retain-days: 7
    storage:
      backend: ${ALINKSEC_LIBRARY_STORAGE:local}
      endpoint: ${ALINKSEC_LIBRARY_S3_ENDPOINT:}
      bucket: ${ALINKSEC_LIBRARY_S3_BUCKET:}
      region: ${ALINKSEC_LIBRARY_S3_REGION:us-east-1}
      access-key: ${ALINKSEC_LIBRARY_S3_ACCESS_KEY:}
      secret-key: ${ALINKSEC_LIBRARY_S3_SECRET_KEY:}
      prefix: alinksec
  database:
    type: postgres
  server:
    port: 9443
    cert-dir: ${ALINKSEC_CERT_DIR:./data/certs}
    web-tls-dir: ${ALINKSEC_WEB_TLS_DIR:./data/web-tls}
    tls-sans: ${ALINKSEC_SERVER_TLS_SANS:localhost,127.0.0.1,::1,alinksec-server}
    public-host: ${ALINKSEC_PUBLIC_HOST:}
    agent-cert-days: 3650
  policy:
    current-version: v0
  metrics:
    enabled: ${ALINKSEC_METRICS_ENABLED:true}
    vm-base-url: http://${VM_HOST:localhost}:8428
  signature:
    storage-dir: ${ALINKSEC_SIG_DIR:./data/signature}
    # Agent 下载特征包的基础地址（须为 Agent 可达的 HTTPS 入口）
    download-base-url: https://${ALINKSEC_SIG_BASE:127.0.0.1:8443}
    push-interval-ms: 3600000   # 特征库兜底推送间隔（导入后立即推送 + 定时兜底）

  patch:
    storage-dir: ${ALINKSEC_PATCH_DIR:./data/patch}
    # Agent 下载补丁包的基础地址（与 signature 同一 REST 出口）
    download-base-url: https://${ALINKSEC_SIG_BASE:127.0.0.1:8443}

  upgrade:
    storage-dir: ${ALINKSEC_UPGRADE_DIR:./data/agent-upgrade}
    download-base-url: https://${ALINKSEC_SIG_BASE:127.0.0.1:8443}

logging:
  level:
    com.alinksec: INFO
