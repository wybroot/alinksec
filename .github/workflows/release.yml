name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (full CI must have passed on this commit)
        required: true
        default: v0.0.2
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      ci-run: ${{ steps.ci.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tag, versions and main ancestry
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node deploy/release/check-version.mjs "$RELEASE_TAG"
          sha=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$sha"
          git merge-base --is-ancestor "$sha" origin/main
          printf 'tag=%s\nsha=%s\n' "$RELEASE_TAG" "$sha" >> "$GITHUB_OUTPUT"
      - name: Require complete successful CI for the tagged commit
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { findValidatedRun } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/deploy/release/ci-gate.mjs`));
            const run = await findValidatedRun(github, context.repo.owner, context.repo.repo, '${{ steps.source.outputs.sha }}');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            for (const name of ['agent-linux-amd64', 'agent-linux-arm64', 'agent-windows-amd64']) {
              if (!artifacts.some(artifact => artifact.name === name && !artifact.expired)) {
                throw new Error(`Validated artifact ${name} is unavailable; rerun full CI on the release commit.`);
              }
            }
            core.setOutput('run', run.id);
            core.info(`Full CI verified: ${run.html_url}`);
      - name: Check Docker Hub credential configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'wangyanbiao' }}
        run: |
          test "$DOCKERHUB_USERNAME" = wangyanbiao || { echo 'Docker Hub username must match wangyanbiao/alinksec.' >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Configure DOCKERHUB_TOKEN or DOCKERHUB_PASSWORD with push access to wangyanbiao/alinksec.' >&2; exit 1; }

  build-images:
    needs: verify
    name: release-images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'wangyanbiao' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      - name: Build all release images serially before pushing
        run: |
          for component in server web sqlite-maintenance; do
            docker build --platform "linux/$RELEASE_ARCH" --provenance=false \
              --build-arg ALPINE_MIRROR=dl-cdn.alpinelinux.org \
              --label "org.opencontainers.image.version=$RELEASE_TAG" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              -f "deploy/docker/Dockerfile.$component" \
              -t "wangyanbiao/alinksec:$component-$RELEASE_TAG-$RELEASE_ARCH" .
          done
      - name: Smoke test the actual release images serially
        run: |
          bash deploy/tests/server-image-smoke.sh
          mvn -B -ntp -T1 -f server/pom.xml -DskipTests package
          bash deploy/tests/web-image-smoke.sh
          bash deploy/tests/sqlite-maintenance-local.sh
        env:
          ALINKSEC_SMOKE_SERVER_IMAGE: wangyanbiao/alinksec:server-${{ needs.verify.outputs.tag }}-${{ matrix.arch }}
          ALINKSEC_SMOKE_WEB_IMAGE: wangyanbiao/alinksec:web-${{ needs.verify.outputs.tag }}-${{ matrix.arch }}
          ALINKSEC_SQLITE_MAINTENANCE_IMAGE: wangyanbiao/alinksec:sqlite-maintenance-${{ needs.verify.outputs.tag }}-${{ matrix.arch }}
          ALINKSEC_MAINTENANCE_TEST_ALLOW_FIXTURES: 'true'
      - name: Push verified versioned images serially
        run: |
          for component in server web sqlite-maintenance; do
            docker push "wangyanbiao/alinksec:$component-$RELEASE_TAG-$RELEASE_ARCH"
          done
          node deploy/release/images.mjs record "$RELEASE_ARCH"
      - name: Retain tested image digests
        uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ matrix.arch }}
          path: release/images-${{ matrix.arch }}.json
          if-no-files-found: error

  publish:
    needs: [verify, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      ALINKSEC_CI_RUN_ID: ${{ needs.verify.outputs.ci-run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'wangyanbiao' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      - name: Download the three tested native Agents
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          merge-multiple: true
          path: release/bin
          run-id: ${{ needs.verify.outputs.ci-run }}
          github-token: ${{ github.token }}
      - name: Download both sets of tested image digests
        uses: actions/download-artifact@v4
        with:
          pattern: release-images-*
          merge-multiple: true
          path: release
      - name: Publish and verify multi-platform image indexes
        run: node deploy/release/images.mjs merge
      - name: Assemble deployment source, manifest and SHA256 checksums
        run: |
          node deploy/release/make-assets.mjs
          cd release
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release after all images and assets succeed
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "ALinkSec $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            "release/alinksec-$RELEASE_TAG.tar.gz" \
            release/alinksec-agent-linux-amd64 \
            release/alinksec-agent-linux-arm64 \
            release/alinksec-agent-windows-amd64.exe \
            release/release-manifest.json release/SHA256SUMS
      - name: Retain release checksums and manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.verify.outputs.tag }}
          path: |
            release/SHA256SUMS
            release/release-manifest.json
          if-no-files-found: error
