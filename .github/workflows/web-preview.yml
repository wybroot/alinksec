name: Web preview

on:
  push:
    branches: [develop]
    paths:
      - 'web/**'
      - '.github/workflows/web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Test and build the production console
        working-directory: web
        run: npm test && npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=768
      - name: Install isolated browser
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Validate monitoring screen interactions and animation boundaries
        working-directory: web
        run: node test/screen-browser.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-screen-evidence
          path: .tmp/screen-browser
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain validated preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
