name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: mvn -B test
        working-directory: server
      - run: go test ./...
        working-directory: agent
      - run: npm ci && npm run build
        working-directory: web

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alinksec
          POSTGRES_PASSWORD: alinksec-test
          POSTGRES_DB: alinksec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alinksec -d alinksec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -h localhost -U alinksec -d alinksec -f deploy/sql/001_init.sql
        env:
          PGPASSWORD: alinksec-test
      - run: |
          count=$(psql -h localhost -U alinksec -d alinksec -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          test "$count" = "35"
        env:
          PGPASSWORD: alinksec-test
