name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      HOST_IP: ci.alinksec.test
      ALINKSEC_BIND_ADDRESS: 127.0.0.1
      ALINKSEC_POSTGRES_PASSWORD: ci-postgres-password
      ALINKSEC_POSTGRES_APP_PASSWORD: ci-postgres-app-password
      ALINKSEC_BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      ALINKSEC_BOOTSTRAP_ENROLL_TOKEN: ENROLL-ci-smoke-test
      ALINKSEC_JWT_SECRET: ci-jwt-secret-for-compose-smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check generated SQLite schema
        shell: pwsh
        run: ./deploy/sql/generate-sqlite-schema.ps1 -Check
      - name: Check SQLite maintenance failure handling
        run: bash deploy/tests/sqlite-maintenance.test.sh
      - run: mvn -B test
        working-directory: server
      - run: go test ./...
        working-directory: agent
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: docker compose config -q
        working-directory: deploy/docker
      - run: docker compose build
        working-directory: deploy/docker
      - run: docker compose up -d --wait
        working-directory: deploy/docker
      - name: Check HTTPS health with the platform CA
        working-directory: deploy/docker
        run: |
          for attempt in $(seq 1 60); do
            if docker compose cp server:/app/data/certs/ca.crt "$RUNNER_TEMP/alinksec-ca.crt" >/dev/null 2>&1 && \
               curl --fail --silent --show-error --cacert "$RUNNER_TEMP/alinksec-ca.crt" \
                 https://127.0.0.1:8443/api/health | jq -e '.code == 0' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Check Agent endpoint and certificate SAN
        working-directory: deploy/docker
        run: |
          test "$(docker compose exec -T server printenv ALINKSEC_SIG_BASE)" = "$HOST_IP:8443"
          docker compose cp server:/app/data/certs/server.crt "$RUNNER_TEMP/alinksec-server.crt"
          openssl x509 -in "$RUNNER_TEMP/alinksec-server.crt" -noout -ext subjectAltName |
            grep -F "DNS:$HOST_IP"
      - name: Stop production deployment before lightweight smoke test
        working-directory: deploy/docker
        run: docker compose down -v --remove-orphans
      - name: Check and build lightweight Compose
        working-directory: deploy/docker
        run: |
          docker compose -f docker-compose.lite.yml config -q
          docker compose -f docker-compose.lite.yml build
      - name: Start lightweight SQLite deployment
        working-directory: deploy/docker
        run: docker compose -f docker-compose.lite.yml up -d --wait
      - name: Check lightweight HTTPS health, backup and restore
        run: |
          docker compose -f deploy/docker/docker-compose.lite.yml cp server:/app/data/certs/ca.crt "$RUNNER_TEMP/alinksec-lite-ca.crt"
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/alinksec-lite-ca.crt" \
            https://127.0.0.1:8443/api/health | jq -e '.code == 0' >/dev/null
          export ALINKSEC_BACKUP_DIR="$RUNNER_TEMP/alinksec-lite-backups"
          docker compose -f deploy/docker/docker-compose.lite.yml run --rm -T --no-deps \
            sqlite-maintenance /data/alinksec.db \
            "CREATE TABLE ci_restore_probe(value TEXT NOT NULL); INSERT INTO ci_restore_probe VALUES ('before');"
          bash deploy/sqlite-maintenance.sh backup ci-smoke.db
          bash deploy/sqlite-maintenance.sh verify ci-smoke.db
          docker compose -f deploy/docker/docker-compose.lite.yml run --rm -T --no-deps \
            sqlite-maintenance /data/alinksec.db "UPDATE ci_restore_probe SET value = 'after';"
          bash deploy/sqlite-maintenance.sh restore ci-smoke.db --yes
          restored=$(docker compose -f deploy/docker/docker-compose.lite.yml run --rm -T --no-deps \
            sqlite-maintenance /data/alinksec.db "SELECT value FROM ci_restore_probe;")
          test "$restored" = before
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/alinksec-lite-ca.crt" \
            https://127.0.0.1:8443/api/health | jq -e '.code == 0' >/dev/null
      - name: Show Compose logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker/docker-compose.yml logs --no-color --tail=200 || true
          docker compose -f deploy/docker/docker-compose.lite.yml logs --no-color --tail=200 || true
      - name: Remove CI containers and volumes
        if: always()
        run: |
          docker compose -f deploy/docker/docker-compose.yml down -v --remove-orphans || true
          docker compose -f deploy/docker/docker-compose.lite.yml down -v --remove-orphans || true

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alinksec
          POSTGRES_PASSWORD: alinksec-test
          POSTGRES_DB: alinksec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alinksec -d alinksec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U alinksec -d alinksec -f deploy/sql/001_init.sql
        env:
          PGPASSWORD: alinksec-test
      - run: |
          count=$(psql -h localhost -U alinksec -d alinksec -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          test "$count" = "38"
        env:
          PGPASSWORD: alinksec-test
      - name: Simulate previous schema and run migrations twice
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U alinksec -d alinksec <<'SQL'
          ALTER TABLE t_agent DROP COLUMN isolation_status;
          ALTER TABLE t_agent DROP COLUMN isolation_command_id;
          ALTER TABLE t_agent DROP COLUMN isolation_error;
          ALTER TABLE t_agent DROP COLUMN isolation_updated_at;
          SQL
          bash deploy/migrations/run-migrations.sh
          bash deploy/migrations/run-migrations.sh
        env:
          PGHOST: localhost
          PGDATABASE: alinksec
          PGUSER: alinksec
          PGPASSWORD: alinksec-test
          ALINKSEC_APP_DB_USER: alinksec_app
          ALINKSEC_APP_DB_PASSWORD: alinksec-app-test
          ALINKSEC_BIND_ADDRESS: 127.0.0.1
          ALINKSEC_MIGRATIONS_DIR: deploy/migrations
      - name: Verify migration and least-privilege application role
        run: |
          test "$(psql -Atc "SELECT count(*) FROM t_schema_migration")" = "1"
          test "$(psql -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")" = "39"
          test "$(psql -Atc "SELECT concat_ws('|', rolsuper, rolcreatedb, rolcreaterole, rolreplication) FROM pg_roles WHERE rolname='alinksec_app'")" = "false|false|false|false"
          test "$(psql -Atc "SELECT has_schema_privilege('alinksec_app', 'public', 'CREATE')")" = "f"
          test "$(psql -Atc "SELECT has_table_privilege('alinksec_app', 'public.t_agent', 'SELECT,INSERT,UPDATE,DELETE')")" = "t"
          test "$(psql -Atc "SELECT has_table_privilege('alinksec_app', 'public.t_schema_migration', 'SELECT')")" = "f"
          PGPASSWORD=alinksec-app-test psql -v ON_ERROR_STOP=1 -h localhost -U alinksec_app -d alinksec -c "SELECT count(*) FROM t_agent"
          if PGPASSWORD=alinksec-app-test psql -v ON_ERROR_STOP=1 -h localhost -U alinksec_app -d alinksec -c "CREATE TABLE privilege_escape(id int)"; then
            echo "application role unexpectedly has DDL permission" >&2
            exit 1
          fi
        env:
          PGHOST: localhost
          PGDATABASE: alinksec
          PGUSER: alinksec
          PGPASSWORD: alinksec-test
