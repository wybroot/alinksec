name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only native Windows Agent validation
        type: boolean
        default: false

jobs:
  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: agent/go.sum
      - name: Check Windows Agent and service lifecycle
        run: go test -v -count=1 ./cmd/agent ./internal/config ./internal/configguard ./internal/scan ./internal/resources ./internal/securestate ./internal/windowslogin ./internal/upgrade ./internal/isolation ./internal/baseline ./internal/collector ./internal/packageversion ./internal/fixer
        working-directory: agent
      - name: Check native Windows resource feedback and recovery
        run: go test -v -count=1 -timeout=1m -run '^TestNativeResourceFeedback$' ./internal/resources
        working-directory: agent
        env:
          ALINKSEC_RESOURCE_NATIVE_REQUIRED: 'true'
          ALINKSEC_RESOURCE_EVIDENCE_FILE: ${{ github.workspace }}/.tmp/resource-native/result.json
      - name: Retain native Windows resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: resource-validation-windows-amd64
          path: .tmp/resource-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Build native Windows Agent
        run: go build -trimpath -ldflags "-s -w" -o alinksec-agent-windows-amd64.exe ./cmd/agent
        working-directory: agent
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
      - name: Check native Windows detection, quarantine and periodic protection
        run: go test -v -count=1 ./internal/virusscan ./internal/guard ./internal/comm
        working-directory: agent
      - name: Check actual Windows SCM service and TLS communication
        run: go test -v -count=1 -timeout=4m -run '^TestNativeWindowsService$' ./cmd/agent
        working-directory: agent
        env:
          ALINKSEC_SMOKE_ALLOW_FIXTURES: 'true'
          ALINKSEC_SMOKE_AGENT_BIN: ${{ github.workspace }}/agent/alinksec-agent-windows-amd64.exe
      - name: Check native Windows ransomware writer attribution and safe response
        run: go test -v -count=1 -timeout=2m -run '^TestNativeWindowsRansomAttribution$' ./internal/guard
        working-directory: agent
        env:
          ALINKSEC_RANSOM_NATIVE_REQUIRED: 'true'
          ALINKSEC_RANSOM_EVIDENCE_FILE: ${{ github.workspace }}/.tmp/windows-ransom-native/result.json
      - name: Retain native Windows ransomware attribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-ransom-validation-windows-amd64
          path: .tmp/windows-ransom-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain validated native Windows Agent
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-amd64
          path: agent/alinksec-agent-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Check actual Windows upgrade, watchdog restart and automatic rollback
        run: |
          go build -trimpath -o alinksec-upgrade-broken.exe ./internal/upgrade/testdata/broken
          go test -v -count=1 -timeout=4m -run '^TestNativeUpgradeLifecycle$' ./cmd/agent
        working-directory: agent
        env:
          ALINKSEC_UPGRADE_NATIVE_REQUIRED: 'true'
          ALINKSEC_SMOKE_AGENT_BIN: ${{ github.workspace }}/agent/alinksec-agent-windows-amd64.exe
          ALINKSEC_UPGRADE_BROKEN_BIN: ${{ github.workspace }}/agent/alinksec-upgrade-broken.exe
          ALINKSEC_UPGRADE_EVIDENCE_FILE: ${{ github.workspace }}/.tmp/upgrade-native/result.json
      - name: Retain native Windows upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-validation-windows-amd64
          path: .tmp/upgrade-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check actual Windows isolation lease, owner failure and automatic withdrawal
        run: go test -v -count=1 -timeout=3m -run '^TestNativeIsolationLifecycle$' ./cmd/agent
        working-directory: agent
        env:
          ALINKSEC_ISOLATION_NATIVE_REQUIRED: 'true'
          ALINKSEC_SMOKE_AGENT_BIN: ${{ github.workspace }}/agent/alinksec-agent-windows-amd64.exe
          ALINKSEC_ISOLATION_EVIDENCE_FILE: ${{ github.workspace }}/.tmp/isolation-native/result.json
      - name: Retain native Windows isolation evidence
        uses: actions/upload-artifact@v4
        with:
          name: isolation-validation-windows-amd64
          path: .tmp/isolation-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Check actual Windows configuration tampering, offline restart and durable replay
        run: go test -v -count=1 -timeout=3m -run '^TestConfigIntegrityLifecycle$' ./cmd/agent
        working-directory: agent
        env:
          ALINKSEC_CONFIG_NATIVE_REQUIRED: 'true'
          ALINKSEC_SMOKE_AGENT_BIN: ${{ github.workspace }}/agent/alinksec-agent-windows-amd64.exe
          ALINKSEC_CONFIG_EVIDENCE_FILE: ${{ github.workspace }}/.tmp/config-native/result.json
      - name: Retain native Windows configuration evidence
        uses: actions/upload-artifact@v4
        with:
          name: config-validation-windows-amd64
          path: .tmp/config-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Check native Windows login reader and WFP lifetime
        run: go test -v -count=1 -timeout=2m -run '^TestNativeWindowsLoginProtection$' ./internal/windowslogin
        working-directory: agent
        env:
          ALINKSEC_WINDOWS_LOGIN_NATIVE_REQUIRED: 'true'
          ALINKSEC_WINDOWS_LOGIN_EVIDENCE_FILE: ${{ github.workspace }}/.tmp/windows-login-native/result.json
      - name: Retain native Windows login evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-login-validation-windows-amd64
          path: .tmp/windows-login-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  build-and-test:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_only
    name: build-and-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.arch }}
      COMPOSE_PARALLEL_LIMIT: '1'
      HOST_IP: ci.alinksec.test
      ALINKSEC_BIND_ADDRESS: 127.0.0.1
      ALINKSEC_POSTGRES_PASSWORD: ci-postgres-password
      ALINKSEC_POSTGRES_APP_PASSWORD: ci-postgres-app-password
      ALINKSEC_BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      ALINKSEC_BOOTSTRAP_ENROLL_TOKEN: ENROLL-ci-smoke-test
      # Full maintenance must preserve the generated secret in server-data too.
      ALINKSEC_JWT_SECRET: ''
      ALINKSEC_SERVER_IMAGE: alinksec-server:latest
      ALINKSEC_WEB_IMAGE: alinksec-web:latest
      ALINKSEC_SQLITE_MAINTENANCE_IMAGE: alinksec-sqlite-maintenance:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check generated SQLite schema
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: ./deploy/sql/generate-sqlite-schema.ps1 -Check
      - name: Check release versions and publication gate
        run: |
          node deploy/release/check-version.mjs
          node --test --test-concurrency=1 deploy/tests/release-*.test.mjs
      - name: Check SQLite maintenance failure handling
        run: bash deploy/tests/sqlite-maintenance.test.sh
      - name: Check complete maintenance failure, rollback and archive boundaries
        run: python3 -B -W error::ResourceWarning -m unittest discover -s deploy/tests -p test_operations.py -v
      - name: Check security feed and baseline package tools
        run: |
          python3 -B -m unittest discover -s deploy/tests -p 'test_*_tools.py' -v
          node --test deploy/tests/baseline-package.test.mjs
      - name: Check deployment configuration and least-privilege boundaries
        run: node --test --test-concurrency=1 deploy/tests/deployment-config.test.mjs
      - run: npm ci && npm test && npm audit --omit=dev --registry=https://registry.npmjs.org && npm run build
        working-directory: web
      - name: Retain validated web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ matrix.arch }}
          path: web/dist/
          retention-days: 7
      - name: Install serial browser validation runtime
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check library schedules and history in the production web bundle
        working-directory: web
        run: node test/libraries-browser.mjs
      - name: Check software inventory identity and incomplete collection in the production web bundle
        working-directory: web
        run: node test/software-inventory-browser.mjs
      - name: Check rule provenance, backport declarations and unsafe historical references in the production web bundle
        working-directory: web
        run: node test/vulnerability-provenance-browser.mjs
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm dpkg util-linux
      - run: mvn -B package
        env:
          ALINKSEC_PATCH_NATIVE_REQUIRED: "true"
          ALINKSEC_GOVERNANCE_FIXTURE_DIR: ${{ github.workspace }}/.tmp/source-governance-fixtures
          ALINKSEC_DETECTION_FIXTURE_DIR: ${{ github.workspace }}/.tmp/detection-capabilities-fixtures
          ALINKSEC_ISOLATION_FIXTURE_DIR: ${{ github.workspace }}/.tmp/isolation-console-fixtures
          ALINKSEC_WEAKPWD_BROWSER_FIXTURES: ${{ github.workspace }}/.tmp/weakpwd-fixtures
          ALINKSEC_WINDOWS_LOGIN_BROWSER_FIXTURES: ${{ github.workspace }}/.tmp/windows-login-fixtures
        working-directory: server
      - name: Check source governance with captured database lifecycle responses
        working-directory: web
        run: node test/source-governance-browser.mjs
      - name: Check detection evidence and acknowledged file states with database lifecycle responses
        working-directory: web
        run: node test/detection-capabilities-browser.mjs
      - name: Check weak-password coverage and redacted history with database responses
        working-directory: web
        run: node test/weak-password-browser.mjs
      - name: Check Windows login scope and coverage with captured database responses
        working-directory: web
        run: node test/windows-login-browser.mjs
      - name: Check isolation console with captured database lifecycle states
        working-directory: web
        run: node test/isolation-browser.mjs
      - name: Check local SQLite validation workflow
        run: bash deploy/tests/api-smoke-local.sh
      - name: Check baseline review and mixed-system selection in the production web bundle
        working-directory: web
        run: node test/baseline-packages-browser.mjs
      - name: Check real SQLite maintenance and restored application
        timeout-minutes: 10
        run: |
          docker build --build-arg ALPINE_MIRROR=dl-cdn.alpinelinux.org -f deploy/docker/Dockerfile.sqlite-maintenance -t alinksec-sqlite-maintenance:latest .
          bash deploy/tests/sqlite-maintenance-local.sh
        env:
          ALINKSEC_MAINTENANCE_TEST_ALLOW_FIXTURES: 'true'
      - name: Ensure native OpenSSH configuration checks are available
        run: |
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          # Root sshd -T also requires its privilege-separation directory.
          # Preparing this runner directory does not start an SSH listener.
          if ! sudo test -e /run/sshd; then
            sudo install -d -o root -g root -m 0755 /run/sshd
          fi
      - run: go test -v ./...
        working-directory: agent
        env:
          ALINKSEC_SSH_NATIVE_REQUIRED: 'true'
          ALINKSEC_PACKAGE_REPAIR_NATIVE_REQUIRED: 'true'
      - name: Check native Linux resource feedback and recovery
        run: go test -v -count=1 -timeout=1m -run '^TestNativeResourceFeedback$' ./internal/resources
        working-directory: agent
        env:
          ALINKSEC_RESOURCE_NATIVE_REQUIRED: 'true'
          ALINKSEC_RESOURCE_EVIDENCE_FILE: ${{ github.workspace }}/.tmp/resource-native/result.json
      - name: Retain native Linux resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: resource-validation-linux-${{ matrix.arch }}
          path: .tmp/resource-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check native offline password hashes and bounded coverage
        working-directory: agent
        run: |
          go test -c -o ../.tmp/weakpwd-native.test ./internal/scan
          sudo env ALINKSEC_WEAKPWD_NATIVE_REQUIRED=true ALINKSEC_WEAKPWD_EVIDENCE_FILE="$GITHUB_WORKSPACE/.tmp/weakpwd-native/result.json" ../.tmp/weakpwd-native.test -test.v
      - name: Retain native weak-password evidence
        uses: actions/upload-artifact@v4
        with:
          name: weakpwd-validation-linux-${{ matrix.arch }}
          path: .tmp/weakpwd-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check native protected local identity files and redacted evidence
        working-directory: agent
        run: |
          mkdir -p ../.tmp
          go test -c -o ../.tmp/baseline-native.test ./internal/baseline
          cd internal/baseline
          sudo env ALINKSEC_IDENTITY_NATIVE_REQUIRED=true ../../../.tmp/baseline-native.test -test.v -test.run '^TestNativeLocalIdentity$'
      - name: Check native fixed log metadata and ACL boundaries
        working-directory: agent/internal/baseline
        run: sudo env ALINKSEC_LOG_METADATA_NATIVE_REQUIRED=true ../../../.tmp/baseline-native.test -test.v -test.run '^TestNativeLogMetadata$'
      - name: Check native OpenSSH name resolution and banner declarations with mandatory input boundaries
        working-directory: agent/internal/baseline
        run: sudo env ALINKSEC_SSH_NOTICE_NATIVE_REQUIRED=true ../../../.tmp/baseline-native.test -test.v -test.run '^TestNativeSSHNotice$'
      - name: Check native systemd service and Ctrl-Alt-Del observations with isolated runner fixtures
        run: bash deploy/tests/systemd-native.sh
      - name: Check native AppArmor root modes and isolated unattached profile transitions
        run: bash deploy/tests/apparmor-native.sh
      - name: Check native kernel audit and isolated private watch rules
        run: bash deploy/tests/audit-native.sh
      - name: Check isolated auditd native configuration parsing and declared log metadata
        run: bash deploy/tests/auditd-native.sh
      - name: Check isolated Debian cron native file selection and metadata boundaries
        run: bash deploy/tests/cron-native.sh
      - name: Check isolated rsyslog native cron routing across all eight severities
        run: bash deploy/tests/rsyslog-cron-native.sh
      - name: Check isolated sudoers native declarations and mandatory input boundaries
        run: bash deploy/tests/sudoers-native.sh
      - name: Check isolated APT native installation/source declarations and mandatory input boundaries
        run: bash deploy/tests/apt-native.sh
      - name: Check isolated Ubuntu24 PAM password, login lockout and resource limits
        run: |
          cp .tmp/baseline-native.test .tmp/pam-native.test
          bash deploy/tests/pam-password-native.sh
      - name: Check isolated Rocky9 DNF signature declarations against native configuration
        run: |
          (cd agent && CGO_ENABLED=0 go test -c -o ../.tmp/dnf-native.test ./internal/baseline)
          bash deploy/tests/dnf-native.sh
      - name: Compare full package versions with native RPM and DPKG ordering
        run: python3 -B deploy/tests/package-version-native.py
      - name: Check native DPKG and RPM inventory identities
        run: |
          (cd agent && CGO_ENABLED=0 go test -c -o ../.tmp/software-native.test ./internal/collector)
          ALINKSEC_SOFTWARE_NATIVE_REQUIRED=true .tmp/software-native.test -test.v -test.run '^TestNativeSoftwareInventory$'
          docker run --rm --read-only --network=none --memory=128m --memory-swap=128m --cpus=1 --pids-limit=64 \
            --cap-drop=ALL --security-opt=no-new-privileges:true \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --env ALINKSEC_SOFTWARE_NATIVE_REQUIRED=true --env GOMEMLIMIT=64MiB \
            alinksec-dnf-native-validation:latest \
            /workspace/.tmp/software-native.test -test.v -test.run '^TestNativeSoftwareInventory$'
      - name: Check bounded native RPM headers without executing package scripts
        run: |
          (cd agent && CGO_ENABLED=0 go test -c -o ../.tmp/package-repair-native.test ./internal/fixer)
          docker build -f deploy/tests/fixtures/Dockerfile.package-repair -t alinksec-package-repair-validation:latest .
          docker run --rm --network=none --memory=192m --memory-swap=256m --cpus=1 --pids-limit=64 \
            --cap-drop=ALL --security-opt=no-new-privileges:true \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" --env GOMEMLIMIT=96MiB \
            --env ALINKSEC_RPM_REPAIR_NATIVE_REQUIRED=true alinksec-package-repair-validation:latest \
            /workspace/.tmp/package-repair-native.test -test.v -test.run '^TestNativeRPMPackageMetadataIsReadWithoutRunningPackageScripts$'
      - name: Retain native package version comparisons
        uses: actions/upload-artifact@v4
        with:
          name: package-version-native-${{ matrix.arch }}
          path: .tmp/package-version-native.tsv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check isolated Ubuntu24 Shadow account aging defaults and mandatory input boundaries
        run: bash deploy/tests/shadow-defaults-native.sh
      - name: Check isolated Ubuntu24 Bash global startup declarations and mandatory input boundaries
        run: bash deploy/tests/bash-policy-native.sh
      - name: Check isolated linker metadata and reviewed privileged file inventory
        run: bash deploy/tests/program-files-native.sh
      - name: Check isolated IPv4 host role, complete interfaces and kernel parameter references
        run: bash deploy/tests/ipv4-host-native.sh
      - name: Check concurrent guard policy updates and Agent baseline runtime observations
        run: go test -race ./internal/windowslogin ./internal/resources ./internal/guard ./internal/configguard ./internal/isolation ./internal/baseline ./internal/comm ./internal/scan ./internal/virusscan
        working-directory: agent
      - name: Build and validate actual Agents serially
        run: |
          mkdir -p .tmp
          (cd agent && CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o ../.tmp/alinksec-agent ./cmd/agent)
          test "$(.tmp/alinksec-agent version)" = "alinksec-agent $(cat VERSION)"
          docker build -f deploy/tests/fixtures/Dockerfile.agent -t alinksec-agent-validation .
          bash deploy/tests/agent-workflow-local.sh
          ALINKSEC_SMOKE_DETECTION_ONLY=true bash deploy/tests/agent-workflow-local.sh
          bash deploy/tests/firewall-local.sh
          cp .tmp/alinksec-agent ".tmp/alinksec-agent-linux-$GOARCH"
        env:
          ALINKSEC_SMOKE_ALLOW_FIXTURES: 'true'
          ALINKSEC_SMOKE_AGENT_BIN: .tmp/alinksec-agent
      - name: Retain validated native Linux Agent
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-${{ matrix.arch }}
          path: .tmp/alinksec-agent-linux-${{ matrix.arch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check actual systemd upgrade, watchdog restart and automatic rollback
        run: bash deploy/tests/agent-upgrade-native.sh
      - name: Retain native Linux upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-validation-linux-${{ matrix.arch }}
          path: .tmp/upgrade-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check actual systemd isolation lease, owner failure and automatic withdrawal
        run: bash deploy/tests/agent-isolation-native.sh
      - name: Retain native Linux isolation evidence
        uses: actions/upload-artifact@v4
        with:
          name: isolation-validation-linux-${{ matrix.arch }}
          path: .tmp/isolation-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check actual systemd configuration tampering, offline restart and durable replay
        run: bash deploy/tests/agent-config-native.sh
      - name: Retain native Linux configuration evidence
        uses: actions/upload-artifact@v4
        with:
          name: config-validation-linux-${{ matrix.arch }}
          path: .tmp/config-native/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - run: docker compose config -q
        working-directory: deploy/docker
      - run: docker compose build
        working-directory: deploy/docker
      - name: Check standalone server image and restart persistence
        run: bash deploy/tests/server-image-smoke.sh
        env:
          ALINKSEC_SMOKE_SERVER_IMAGE: alinksec-server:latest
      - name: Check actual archive paths, UID/GID and mode with one bounded helper
        run: python3 -B deploy/tests/operations-volume-local.py
        env:
          ALINKSEC_SMOKE_ALLOW_FIXTURES: 'true'
          ALINKSEC_OPERATIONS_TEST_IMAGE: alinksec-server:latest
          ALINKSEC_OPERATIONS_WEB_IMAGE: alinksec-web:latest
      - name: Check second clean server build with a changed version
        run: |
          mkdir -p .tmp/changed-version
          node deploy/tests/snapshot-source.mjs .tmp/changed-version
          java -Xmx128m deploy/tests/ChangeSnapshotVersion.java .tmp/changed-version 0.1.1-VALIDATION
          docker build --no-cache -f deploy/docker/Dockerfile.server -t alinksec-server-changed-version .tmp/changed-version
          bash deploy/tests/server-image-smoke.sh
        env:
          ALINKSEC_SMOKE_SERVER_IMAGE: alinksec-server-changed-version
      - name: Check standalone web image and HTTPS API proxy
        run: bash deploy/tests/web-image-smoke.sh
        env:
          ALINKSEC_SMOKE_WEB_IMAGE: alinksec-web:latest
          ALINKSEC_SMOKE_BROWSER: 'true'
      - name: Retain browser validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation-${{ matrix.arch }}
          path: |
            .tmp/browser-artifacts-*
            .tmp/library-browser-artifacts
            .tmp/source-governance-browser
            .tmp/source-governance-fixtures
            .tmp/isolation-browser
            .tmp/weakpwd-browser
            .tmp/windows-login-browser
            .tmp/weakpwd-fixtures
            .tmp/windows-login-fixtures
            .tmp/isolation-console-fixtures
            .tmp/detection-capabilities-browser
            .tmp/detection-capabilities-fixtures
            .tmp/detection-capabilities-native
            .tmp/software-inventory-browser
            .tmp/vulnerability-provenance-browser
            .tmp/baseline-browser-artifacts
            .tmp/baseline-browser-fixtures-sqlite.json
          include-hidden-files: true
          if-no-files-found: ignore
      - run: docker compose up -d --wait
        working-directory: deploy/docker
      - name: Check HTTPS health with the platform CA
        working-directory: deploy/docker
        run: |
          for attempt in $(seq 1 60); do
            if docker compose cp server:/app/data/certs/ca.crt "$RUNNER_TEMP/alinksec-ca.crt" >/dev/null 2>&1 && \
               curl --fail --silent --show-error --cacert "$RUNNER_TEMP/alinksec-ca.crt" \
                 https://127.0.0.1:8443/api/health | jq -e '.code == 0' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Check Agent endpoint and certificate SAN
        working-directory: deploy/docker
        run: |
          test "$(docker compose exec -T server printenv ALINKSEC_SIG_BASE)" = "$HOST_IP:8443"
          docker compose cp server:/app/data/certs/server.crt "$RUNNER_TEMP/alinksec-server.crt"
          openssl x509 -in "$RUNNER_TEMP/alinksec-server.crt" -noout -ext subjectAltName |
            grep -F "DNS:$HOST_IP"
      - name: Check PostgreSQL API contracts
        run: node --test --test-concurrency=1 deploy/tests/api-smoke.test.mjs
        env:
          ALINKSEC_SMOKE_DB: postgres
          ALINKSEC_SMOKE_ALLOW_FIXTURES: 'true'
          ALINKSEC_SMOKE_CA_FILE: ${{ runner.temp }}/alinksec-ca.crt
      - name: Check complete PostgreSQL maintenance and interrupted recovery
        timeout-minutes: 10
        run: python3 -B deploy/tests/operations-smoke.py --mode postgres
        env:
          ALINKSEC_SMOKE_ALLOW_FIXTURES: 'true'
      - name: Stop production deployment before lightweight smoke test
        working-directory: deploy/docker
        run: docker compose down -v --remove-orphans
      - name: Check and build lightweight Compose
        working-directory: deploy/docker
        run: |
          docker compose -f docker-compose.lite.yml config -q
          docker compose -f docker-compose.lite.yml build
      - name: Start lightweight SQLite deployment
        working-directory: deploy/docker
        run: docker compose -f docker-compose.lite.yml up -d --wait
      - name: Check lightweight HTTPS health, backup and restore
        run: |
          docker compose -f deploy/docker/docker-compose.lite.yml cp server:/app/data/certs/ca.crt "$RUNNER_TEMP/alinksec-lite-ca.crt"
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/alinksec-lite-ca.crt" \
            https://127.0.0.1:8443/api/health | jq -e '.code == 0' >/dev/null
          export ALINKSEC_BACKUP_DIR="$RUNNER_TEMP/alinksec-lite-backups"
          docker compose -f deploy/docker/docker-compose.lite.yml run --rm -T --no-deps \
            sqlite-maintenance /data/alinksec.db \
            "CREATE TABLE ci_restore_probe(value TEXT NOT NULL); INSERT INTO ci_restore_probe VALUES ('before');"
          bash deploy/sqlite-maintenance.sh backup ci-smoke.db
          bash deploy/sqlite-maintenance.sh verify ci-smoke.db
          docker compose -f deploy/docker/docker-compose.lite.yml run --rm -T --no-deps \
            sqlite-maintenance /data/alinksec.db "UPDATE ci_restore_probe SET value = 'after';"
          bash deploy/sqlite-maintenance.sh restore ci-smoke.db --yes
          restored=$(docker compose -f deploy/docker/docker-compose.lite.yml run --rm -T --no-deps \
            sqlite-maintenance /data/alinksec.db "SELECT value FROM ci_restore_probe;")
          test "$restored" = before
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/alinksec-lite-ca.crt" \
            https://127.0.0.1:8443/api/health | jq -e '.code == 0' >/dev/null
      - name: Check SQLite API contracts
        run: node --test --test-concurrency=1 deploy/tests/api-smoke.test.mjs
        env:
          ALINKSEC_SMOKE_DB: sqlite
          ALINKSEC_SMOKE_ALLOW_FIXTURES: 'true'
          ALINKSEC_SMOKE_CA_FILE: ${{ runner.temp }}/alinksec-lite-ca.crt
      - name: Check complete SQLite maintenance and interrupted recovery
        timeout-minutes: 10
        run: python3 -B deploy/tests/operations-smoke.py --mode sqlite
        env:
          ALINKSEC_SMOKE_ALLOW_FIXTURES: 'true'
      - name: Retain sanitized complete maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-validation-${{ matrix.arch }}
          path: |
            .tmp/operations-volume-local/result.json
            .tmp/operations-native-postgres/result.json
            .tmp/operations-native-sqlite/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Show Compose logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker/docker-compose.yml logs --no-color --tail=200 || true
          docker compose -f deploy/docker/docker-compose.lite.yml logs --no-color --tail=200 || true
      - name: Remove CI containers and volumes
        if: always()
        run: |
          docker compose -f deploy/docker/docker-compose.yml down -v --remove-orphans || true
          docker compose -f deploy/docker/docker-compose.lite.yml down -v --remove-orphans || true

  schema:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_only
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alinksec
          POSTGRES_PASSWORD: alinksec-test
          POSTGRES_DB: alinksec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alinksec -d alinksec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client rpm dpkg util-linux
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U alinksec -d alinksec -f deploy/sql/001_init.sql
        env:
          PGPASSWORD: alinksec-test
      - run: |
          count=$(psql -h localhost -U alinksec -d alinksec -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          test "$count" = "38"
        env:
          PGPASSWORD: alinksec-test
      - name: Simulate previous schema and run migrations twice
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U alinksec -d alinksec <<'SQL'
          ALTER TABLE t_agent DROP COLUMN isolation_status;
          ALTER TABLE t_agent DROP COLUMN isolation_command_id;
          ALTER TABLE t_agent DROP COLUMN isolation_error;
          ALTER TABLE t_agent DROP COLUMN isolation_updated_at;
          SQL
          bash deploy/migrations/run-migrations.sh
          bash deploy/migrations/run-migrations.sh
        env:
          PGHOST: localhost
          PGDATABASE: alinksec
          PGUSER: alinksec
          PGPASSWORD: alinksec-test
          ALINKSEC_APP_DB_USER: alinksec_app
          ALINKSEC_APP_DB_PASSWORD: alinksec-app-test
          ALINKSEC_BIND_ADDRESS: 127.0.0.1
          ALINKSEC_MIGRATIONS_DIR: deploy/migrations
      - name: Verify migration and least-privilege application role
        run: |
          test "$(psql -Atc "SELECT count(*) FROM t_schema_migration")" = "20"
          test "$(psql -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")" = "64"
          test "$(psql -Atc "SELECT NOT (rolsuper OR rolcreatedb OR rolcreaterole OR rolinherit OR rolreplication OR rolbypassrls) FROM pg_roles WHERE rolname='alinksec_app'")" = "t"
          test "$(psql -Atc "SELECT has_schema_privilege('alinksec_app', 'public', 'CREATE')")" = "f"
          test "$(psql -Atc "SELECT has_table_privilege('alinksec_app', 'public.t_agent', 'SELECT,INSERT,UPDATE,DELETE')")" = "t"
          test "$(psql -Atc "SELECT has_table_privilege('alinksec_app', 'public.t_schema_migration', 'SELECT')")" = "f"
          PGPASSWORD=alinksec-app-test psql -v ON_ERROR_STOP=1 -h localhost -U alinksec_app -d alinksec -c "SELECT count(*) FROM t_agent"
          if PGPASSWORD=alinksec-app-test psql -v ON_ERROR_STOP=1 -h localhost -U alinksec_app -d alinksec -c "CREATE TABLE privilege_escape(id int)"; then
            echo "application role unexpectedly has DDL permission" >&2
            exit 1
          fi
        env:
          PGHOST: localhost
          PGDATABASE: alinksec
          PGUSER: alinksec
          PGPASSWORD: alinksec-test
      - name: Check PostgreSQL migration failures and backup restore
        env:
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_TEST_CONTAINER" mkdir -p /tmp/alinksec-validation/deploy
          docker cp deploy/sql "$PG_TEST_CONTAINER:/tmp/alinksec-validation/deploy/sql"
          docker cp deploy/migrations "$PG_TEST_CONTAINER:/tmp/alinksec-validation/deploy/migrations"
          docker cp deploy/tests "$PG_TEST_CONTAINER:/tmp/alinksec-validation/deploy/tests"
          docker exec -e PGHOST=127.0.0.1 -e PGDATABASE=alinksec -e PGUSER=alinksec \
            -e PGPASSWORD=alinksec-test -e ALINKSEC_MIGRATION_TEST_ALLOW_FIXTURES=true \
            "$PG_TEST_CONTAINER" bash /tmp/alinksec-validation/deploy/tests/postgres-migrations.test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check Agent identity and concurrent baseline and vulnerability workflows with the PostgreSQL application role
        working-directory: server
        run: >-
          mvn -B -T1 -pl alinksec-bootstrap -am
          -Dtest=AgentChannelSecurityIntegrationTest,BaselineConcurrentReportIntegrationTest,VulnerabilityWorkflowIntegrationTest,LibraryGovernanceIntegrationTest,DetectionEvidenceIntegrationTest,WeakPasswordIntegrationTest,WindowsLoginIntegrationTest,UpgradeWatchdogIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dalinksec.integration.database=postgres test
        env:
          ALINKSEC_INTEGRATION_PG_URL: jdbc:postgresql://127.0.0.1:5432/alinksec?stringtype=unspecified
          ALINKSEC_INTEGRATION_PG_USER: alinksec_app
          ALINKSEC_INTEGRATION_PG_PASSWORD: alinksec-app-test
          ALINKSEC_GOVERNANCE_FIXTURE_DIR: ${{ github.workspace }}/.tmp/source-governance-fixtures
          ALINKSEC_DETECTION_FIXTURE_DIR: ${{ github.workspace }}/.tmp/detection-capabilities-fixtures
          ALINKSEC_ISOLATION_FIXTURE_DIR: ${{ github.workspace }}/.tmp/isolation-console-fixtures
          ALINKSEC_WEAKPWD_BROWSER_FIXTURES: ${{ github.workspace }}/.tmp/weakpwd-fixtures
          ALINKSEC_WINDOWS_LOGIN_BROWSER_FIXTURES: ${{ github.workspace }}/.tmp/windows-login-fixtures
      - name: Retain PostgreSQL governance and detection response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-governance-postgres
          path: |
            .tmp/source-governance-fixtures
            .tmp/detection-capabilities-fixtures
            .tmp/weakpwd-fixtures
            .tmp/windows-login-fixtures
          include-hidden-files: true
          if-no-files-found: error
