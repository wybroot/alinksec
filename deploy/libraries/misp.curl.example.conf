# Copy outside the repository; replace URL/key and chmod 600 the actual file.
# Authorization is the raw MISP key, without the Bearer prefix.
url = "https://misp.example.invalid/attributes/restSearch"
header = "Authorization: REPLACE_WITH_READ_ONLY_MISP_KEY"
header = "Content-Type: application/json"
header = "Accept: application/json"
# For a private CA, provide its PEM chain. Never use insecure / -k.
# cacert = "/etc/alinksec-feed/misp-ca.pem"
