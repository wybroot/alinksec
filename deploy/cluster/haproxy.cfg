global
    maxconn 4096
    nbthread 1
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 90s
    timeout server 90s
    timeout check 2s

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend agents
    bind "${ALINKSEC_PROXY_AGENT_BIND}"
    default_backend agent_nodes

backend agent_nodes
    option httpchk GET /api/ready
    http-check expect status 200
    server node-b "${ALINKSEC_NODE_B_GRPC}" check port "${ALINKSEC_NODE_B_CHECK_PORT}" inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none on-marked-down shutdown-sessions
    server node-a "${ALINKSEC_NODE_A_GRPC}" check port "${ALINKSEC_NODE_A_CHECK_PORT}" inter 1s fall 2 rise 2 backup resolvers docker init-addr last,libc,none on-marked-down shutdown-sessions

# Private REST hop: expose it only through the authenticated HTTPS web ingress.
frontend rest
    bind "${ALINKSEC_PROXY_API_BIND}"
    mode http
    default_backend api_nodes

backend api_nodes
    mode http
    balance roundrobin
    option httpchk GET /api/ready
    http-check expect status 200
    server node-a "${ALINKSEC_NODE_A_HTTP}" check inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server node-b "${ALINKSEC_NODE_B_HTTP}" check inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
