# Install only after confirming this directory and clamd.conf match the local
# clamd service. Do not run a second updater for the same database directory.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
Checks 24
ScriptedUpdates yes
TestDatabases yes
NotifyClamd /etc/clamav/clamd.conf
ConnectTimeout 10
ReceiveTimeout 30
MaxAttempts 3
LogTime yes
