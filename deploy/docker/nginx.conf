# ALinkSec 前端 nginx 配置（SPA：Vue Router history 模式）
server {
    listen 80;
    server_name _;

    return 308 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:TLS:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        expires -1;
    }

    # REST API 反代到服务端容器：proxy_pass 不带尾部 URI，/api/xxx 原样透传
    # （服务端 Controller 统一映射 /api/** 前缀）
    location /api/ {
        # Docker 内置 DNS 定期刷新，服务端重建换 IP 后自动恢复代理。
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $alinksec_backend ${ALINKSEC_BACKEND_HOST}:8080;
        proxy_pass http://$alinksec_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 512m;   # 特征库/补丁包上传（经 web 反代走此路径）
    }

    # SPA 路由回退：/dashboard、/screen 等交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
