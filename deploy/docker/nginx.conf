# ALinkSec 前端 nginx 配置（SPA：Vue Router history 模式）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # REST API 反代到服务端容器：proxy_pass 不带尾部 URI，/api/xxx 原样透传
    # （服务端 Controller 统一映射 /api/** 前缀）
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 512m;   # 特征库/补丁包上传（经 web 反代走此路径）
    }

    # SPA 路由回退：/dashboard、/screen 等交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
