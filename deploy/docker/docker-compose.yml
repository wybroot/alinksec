name: alinksec

services:
  # ---------- PostgreSQL 17 ----------
  postgres:
    image: postgres:17
    container_name: alinksec-pg
    environment:
      POSTGRES_USER: alinksec
      POSTGRES_PASSWORD: ${ALINKSEC_POSTGRES_PASSWORD:?set ALINKSEC_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: alinksec
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 首次启动自动执行建表脚本
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alinksec -d alinksec"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # 注意：不映射 5432 到宿主机（仅 compose 内网访问），验证 SQL 用 docker exec

  # ---------- VictoriaMetrics（时序指标，docs/03 §3） ----------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.0
    container_name: alinksec-vm
    # 单机模式：90 天保留（容量规划见总体设计 §6.3）
    command: ["-retentionPeriod=90d", "-storageDataPath=/storage"]
    volumes:
      - vm-data:/storage
    restart: unless-stopped
    # 不映射 8422/8428 到宿主机：查询统一经 server REST 出口（/api/metrics/*）

  # ---------- 服务端 ----------
  server:
    build:
      context: ../..                      # 仓库根
      dockerfile: deploy/docker/Dockerfile.server
    container_name: alinksec-server
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: alinksec
      PG_PASSWORD: ${ALINKSEC_POSTGRES_PASSWORD:?set ALINKSEC_POSTGRES_PASSWORD in .env}
      VM_HOST: victoriametrics
      ALINKSEC_METRICS_ENABLED: "true"
      ALINKSEC_WEB_TLS_DIR: /app/web-tls
      # 首启显式创建管理员和注册码；两个值均从 .env 读取，禁止默认凭据。
      ALINKSEC_BOOTSTRAP_ADMIN_PASSWORD: ${ALINKSEC_BOOTSTRAP_ADMIN_PASSWORD:?set ALINKSEC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      ALINKSEC_BOOTSTRAP_ENROLL_TOKEN: ${ALINKSEC_BOOTSTRAP_ENROLL_TOKEN:?set ALINKSEC_BOOTSTRAP_ENROLL_TOKEN in .env}
      ALINKSEC_LEGACY_COMMAND_POLICY: ${ALINKSEC_LEGACY_COMMAND_POLICY:-report}
      # 特征库/补丁包下载地址：必须是 Agent 可达的 HTTPS 入口。
      ALINKSEC_SIG_BASE: "${HOST_IP:-alinksec-server}:8443"
      # 生产建议显式设置 JWT 密钥（不设则首次启动自动生成并持久化到 volume）
      ALINKSEC_JWT_SECRET: ${ALINKSEC_JWT_SECRET:-}
      # 证书 SAN：必须在首次启动前带上宿主机 IP（证书只生成一次）！
      ALINKSEC_SERVER_TLS_SANS: "localhost,127.0.0.1,::1,alinksec-server,${HOST_IP:-alinksec-server}"
      TZ: Asia/Shanghai
    ports:
      - "9443:9443"      # gRPC mTLS，Agent 接入
    depends_on:
      postgres:
        condition: service_healthy
      victoriametrics:
        condition: service_started
    volumes:
      - server-data:/app/data            # 证书 + 状态持久化
      - web-tls:/app/web-tls             # only server leaf TLS material for nginx
    restart: unless-stopped

  # ---------- 前端 ----------
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    container_name: alinksec-web
    ports:
      - "8081:80"         # redirects to HTTPS
      - "8443:443"        # https://<服务器IP>:8443
    depends_on:
      - server
    volumes:
      - web-tls:/etc/nginx/tls:ro
    restart: unless-stopped

volumes:
  pg-data:
  vm-data:
  server-data:
  web-tls:
